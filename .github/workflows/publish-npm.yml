name: Publish npm package

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Tag to publish, for example v1.0.0
                required: true
                type: string
    push:
        tags:
            - "v*"

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        environment:
            name: npm
            url: https://www.npmjs.com/package/react-native-jelly-tabs

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Set package version from tag
              env:
                  PUBLISH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
              run: |
                  TAG_VERSION="${PUBLISH_TAG#v}"

                  if [ -z "$TAG_VERSION" ] || [ "v$TAG_VERSION" != "$PUBLISH_TAG" ]; then
                    echo "Invalid release tag: $PUBLISH_TAG"
                    exit 1
                  fi

                  bun pm pkg set "version=$TAG_VERSION"

            - name: Build npm package
              run: bun run build

            - name: Publish
              run: npx --yes npm@11.5.1 publish --provenance --access public
